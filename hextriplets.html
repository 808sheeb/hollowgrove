This is from Taper #16: For Good Measure, Spring 2026:

https://taper.badquar.to/16/hex_triplets.html

Colours blend at every vertex. A color may be specified as an RGB
triplet in hexadecimal format or a "hex triplet". Implications are
created when selecting a background, at the behest of the hexadecimal.
We see words coming and leaving view, some left in an inbetween state.
Akin to the actions of others, the way these colors overlap allow for
different tones to be ignored, forgotten, or lost as well as heard,
seen & loved.
